<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/estilos-login-registro.css">
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">Registro</div>

        <form id="formRegistro">

            <input type="text" id="nombre" placeholder="Nombre" required>

            <input type="text" id="apellido" placeholder="Apellido" required>

            <input type="date" id="fecha" required>

            <input type="email" id="correo" placeholder="Correo electrónico" required>

            <input type="password" id="password" placeholder="Confirmar contraseña" required>

            <button type="submit">Registrarse</button>
        </form>

        <p class="mensaje">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
        </p>

        <p id="mensajeRegistro" class="error"></p>

    </div>

</body>

</html>
