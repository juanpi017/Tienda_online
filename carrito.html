<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>

    <link rel="stylesheet" href="css/estilosCarrito.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <div class="logo-title">
                <div class="logo">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>

                <h1>Carrito de Compras</h1>
            </div>

            <div class="usuario">
                JuanPa
            </div>

        </div>

        <div class="contenido">

            <div class="carrito">

                <div class="encabezado-tabla">
                    <div>Producto</div>
                    <div>Precio</div>
                    <div>Cantidad</div>
                </div>

                <div class="producto">
                    <div>Nombre producto 1</div>
                    <div>$20.000</div>
                    <div class="cantidad">
                        <button class="btn-cantidad">-</button>
                        <span>1</span>
                        <button class="btn-cantidad">+</button>
                    </div>
                </div>

                <div class="producto">
                    <div>Nombre producto 2</div>
                    <div>$50.000</div>
                    <div class="cantidad">
                        <button class="btn-cantidad">-</button>
                        <span>1</span>
                        <button class="btn-cantidad">+</button>
                    </div>
                </div>

                <div class="producto">
                    <div>Nombre producto 3</div>
                    <div>$10.000</div>
                    <div class="cantidad">
                        <button class="btn-cantidad">-</button>
                        <span>1</span>
                        <button class="btn-cantidad">+</button>
                    </div>
                </div>

                <div class="producto">
                    <div>Nombre producto 4</div>
                    <div>$20.000</div>
                    <div class="cantidad">
                        <button class="btn-cantidad">-</button>
                        <span>1</span>
                        <button class="btn-cantidad">+</button>
                    </div>
                </div>

                <div class="total">
                    <h2>Total</h2>
                    <span>$100.000</span>
                </div>

                <a href="index.html" class="continuar">
                    Continuar comprando
                </a>

            </div>

            <div class="pagos">

                <h2>Métodos de Pago</h2>

                <label class="opcion-pago">
                    <input type="radio" name="pago" value="Tarjeta de crédito">
                    Tarjeta de crédito
                </label>

                <label class="opcion-pago">
                    <input type="radio" name="pago" value="Paypal">
                    Paypal
                </label>

                <label class="opcion-pago">
                    <input type="radio" name="pago" value="Nequi">
                    Nequi
                </label>

                <button class="btn-pagar" onclick="pagar()">
                    Pagar
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
