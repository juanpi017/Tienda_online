<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="logo/logo-removebg-preview.png" alt="Logo de la tienda" class="Logo_img">
        </div>
        <div class="buscador">
            <input type="text" placeholder="Buscar productos...">
            <button>🔍</button>
        </div>
        
        <nav class="menu">
            <a href="login.html">Iniciar sesion / Registro</a>
            <a href="carrito.html">Carrito</a>
            <a href="#">Ayuda</a>
            <a href="#">Cuenta</a>
        </nav>
        
    </header>
    <section class="menu-secundario">
        <button>Categorías</button>
        <button>Más vendidos</button>
        <button>Ofertas</button>
        <button>Lo nuevo</button>
    </section>
    <main class="productos">
        <article class="producto">
            <img src="imagenes/camisa.png" alt="Producto 1">
            <h3>Camisa</h3>
            <p>$80.000</p>
            <button>Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imagenes/zapatos deportivos.png" alt="Producto 2">
            <h3>Zapatos Deportivos</h3>
            <p>$180.000</p>
            <button>Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imagenes/short.png" alt="Producto 2">
            <h3>Short</h3>
            <p>$90.000</p>
            <button>Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imagenes/jeans.png" alt="Producto 1">
            <h3>Jeans</h3>
            <p>$50.000</p>
            <button>Agregar al carrito</button>
        </article>
        <article class="producto">
            <img src="imagenes/medias.png" alt="Producto 2">
            <h3>Medias</h3>
            <p>$30.000</p>
            <button>Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imagenes/boxer.png" alt="Producto 1">
            <h3>Boxer</h3>
            <p>$20.000</p>
            <button>Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imagenes/reloj.png" alt="Producto 2">
            <h3>Reloj</h3>
            <p>$90.000</p>
            <button>Agregar al carrito</button>
        </article>

        <article class="producto">
            <img src="imagenes/sombrero.png" alt="Producto 1">
            <h3>Sombrero</h3>
            <p>$50.000</p>
            <button>Agregar al carrito</button>
        </article>
    </main>

    <footer class="footer">
        <p>© 2026 Tienda Online | Todos los derechos reservados</p>
        <nav>
            <a href="#">Contacto</a>
            <a href="#">Política de Privacidad</a>
            <a href="#">Términos de uso</a>
        </nav>
    </footer>
    <script src="script.js"></script>
</body>
</html>
